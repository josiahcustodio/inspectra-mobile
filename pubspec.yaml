name: clowtec_inspector
description: A high-performance, offline-first mobile app for City Health Office inspectors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend (Supabase: Auth incl. TOTP MFA, Postgres via PostgREST, Storage)
  supabase_flutter: ^2.10.0
  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # UI & Utilities
  mobile_scanner: 7.3.0
  provider: ^6.1.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  uuid: ^4.5.3
  go_router: ^17.5.0
  qr_flutter: ^4.1.0
  # Inspector sign-off (Chunk 7). `signature` was deleted 2026-09-16 as dead
  # code; this re-introduction is deliberate — the Backend Blueprint (Rev 3,
  # §4) replaces the wet-ink SSSR/Signature column of the paper masterlist
  # with a PNG captured at submit. `crypto` provides the SHA-256 that pins
  # the uploaded image to the inspection record.
  signature: ^5.5.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # No `assets:` block: nothing in lib/ loads a bundled asset. The previous
  # entries shipped two establishment photos and the barangay list for the
  # establishment-create form that was deleted in Chunk 1, all unreferenced.
