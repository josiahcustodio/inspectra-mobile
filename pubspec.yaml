name: clowtec_inspector
description: A high-performance, offline-first mobile app for City Health Office inspectors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.5
  google_sign_in: ^6.2.2
  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # UI & Utilities
  mobile_scanner: 7.3.0
  provider: ^6.1.2
  image_picker: ^1.0.7
  signature: ^5.4.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  go_router: ^17.5.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/establishments/
    - assets/data/
