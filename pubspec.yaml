name: clowtec_inspector
description: A high-performance, offline-first mobile app for City Health Office inspectors
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Backend (Supabase: Auth incl. TOTP MFA, Postgres via PostgREST, Storage)
  supabase_flutter: ^2.10.0
  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # UI & Utilities
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  uuid: ^4.5.3
  go_router: ^17.5.0
  qr_flutter: ^4.1.0
  maplibre_gl: ^0.28.0
  permission_handler: ^13.0.2
  ota_update: ^7.1.0
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # No `assets:` block: nothing in lib/ loads a bundled asset. The previous
  # entries shipped two establishment photos and the barangay list for the
  # establishment-create form that was deleted in Chunk 1, all unreferenced.
